name: WebAssembly and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.21'
          actions-cache-folder: emsdk-cache
      - name: Test asset packaging
        run: python3 -m unittest discover -s web/tests -v
      - uses: actions/cache@v4
        with:
          path: build-web/openmpt-prefix
          key: wasm-openmpt-0.8.4-emsdk-4.0.21-v1
      - name: Build the original TFT gameplay for browsers
        env:
          PVZ_WEB_TESTS: 'ON'
        run: bash web/build.sh
      - name: Browser smoke test
        env:
          PVZ_SMOKE_SCREENSHOT: build-web/browser-check.png
        run: |
          npm install --prefix build-web/browser-test playwright@1.51.1
          build-web/browser-test/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/build-web/browser-test/node_modules" node web/tests/browser-gameplay.cjs build-web/dist
          NODE_PATH="$PWD/build-web/browser-test/node_modules" node web/tests/browser-smoke.cjs build-web/dist
      - name: Remove CI fixtures from the published game
        run: |
          emcmake cmake -S build-web/stage -B build-web/build -DPVZ_WEB_TESTS=OFF
          cmake --build build-web/build --parallel 4
          cp build-web/build/index.{html,js,wasm,data} build-web/dist/
          PVZ_EXPECT_PRODUCTION=1 NODE_PATH="$PWD/build-web/browser-test/node_modules" node web/tests/browser-smoke.cjs build-web/dist
      - name: Upload browser verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz-tft-browser-check
          path: build-web/*check.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: pvz-tft-web
          path: build-web/dist
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public Pages game and browser saves
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npm install --prefix build-web/browser-test playwright@1.51.1
          build-web/browser-test/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/build-web/browser-test/node_modules" PVZ_SMOKE_SCREENSHOT="$PWD/build-web/live-game.png" node web/tests/browser-smoke.cjs "$LIVE_URL"
      - name: Upload live game screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pvz-tft-live-check
          path: build-web/live-game.png
          retention-days: 14

