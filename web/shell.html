<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101d16">
  <title>PVZ · TFT</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
    :root { --rail: calc(56px + env(safe-area-inset-bottom)); }
    body { display: grid; place-items: center; font: 16px system-ui,sans-serif; }
    #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; width: min(100vw, calc((100dvh - var(--rail)) * 16 / 9)); background: #000; }
    #game { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; outline: none; }
    #stage:fullscreen { width: 100vw; height: 100dvh; }
    #stage:fullscreen #game, #stage:fullscreen #controls { width: min(100vw, calc((100dvh - var(--rail)) * 16 / 9)); }
    button { display: grid; place-items: center; border: 0; border-radius: 50%; padding: 0; width: 44px; height: 44px; background: #1119; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:hover { background: #333c; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:disabled { opacity: .35; cursor: default; }
    button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #start { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 80px; height: 80px; background: #111c; }
    #start svg { width: 38px; height: 38px; fill: currentColor; }
    #controls { width: 100%; height: var(--rail); flex: 0 0 var(--rail); display: flex; align-items: flex-start; justify-content: flex-end; gap: 6px; padding: 6px 6px max(6px,env(safe-area-inset-bottom)); }
    #notice { position: absolute; bottom: 10px; left: 10px; right: 10px; margin: 0; padding: 10px; border-radius: 8px; background: #101010ed; text-align: center; pointer-events: none; z-index: 5; }

    #loading { position: absolute; left: calc(50% - 18px); top: calc(50% - 18px); width: 36px; height: 36px; border: 3px solid #fff3; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    #status.error { z-index: 4; left: 10%; top: 35%; width: 80%; height: auto; clip-path: none; padding: 20px; margin: 0; background: #151515ed; border-radius: 10px; text-align: center; line-height: 1.5; }
    #pvz-soft-keyboard { position: absolute; left: 50%; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: .01; font-size: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div id="stage">
 <div id="game">
  <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Plants vs. Zombies TFT"></canvas>
  <div id="loading" role="progressbar" aria-label="Đang tải game"></div>
  <button id="start" aria-label="Chơi ngay" title="Chơi ngay" disabled hidden><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
  <input id="pvz-soft-keyboard" type="text" aria-label="Tên người chơi" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" tabindex="-1">
  <p id="status" role="status" aria-live="polite">Đang tải game…</p>
  <pre id="log" hidden></pre>
  <p id="notice" role="status" hidden></p>
 </div>
  <div id="controls">
    <button id="export" aria-label="Sao lưu tiến trình" title="Sao lưu tiến trình" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
    <button id="restore" aria-label="Nhập save trước khi chơi" title="Nhập save trước khi chơi" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></button>
    <input id="import" type="file" accept=".json,application/json" hidden>
    <button id="keyboard" aria-label="Bật bàn phím" title="Bật bàn phím" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 15h8"/></svg></button>
    <button id="fullscreen" aria-label="Toàn màn hình" title="Toàn màn hình"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg></button>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('canvas');
let ready = false, started = false, mounted = false, syncQueue = Promise.resolve();
let gameTimer, activeTouch = null, loadingFailed = false;
function log(message) { $('log').textContent = ($('log').textContent + message + '\n').slice(-18000); }
function status(message, error = false) { $('status').textContent = message; $('status').classList.toggle('error', error); }
function failure(error) { loadingFailed = true; log(String(error)); status('Game gặp lỗi: ' + String(error), true); $('loading').hidden = true; }
let noticeTimer;
function notice(message) { $('notice').textContent=message; $('notice').hidden=false; clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>{$('notice').hidden=true;},5000); }
function sync(populate = false) {
  const task = syncQueue.then(() => new Promise((resolve,reject) => {
    Module.FS.syncfs(populate, error => error ? reject(error) : resolve());
  }));
  syncQueue = task.catch(() => {}); return task;
}
async function save(show = true) {
  if (!started || !mounted) return;
  Module._pvz_web_save();
  try { await sync(); if (show) status('Đã lưu tiến trình trên trình duyệt.'); }
  catch (error) { status('Không lưu được tiến trình. Hãy tải bản sao lưu. ' + error, true); throw error; }
}
var Module = {
  canvas,
  print: (...args) => log(args.join(' ')),
  printErr: (...args) => log(args.join(' ')),
  onAbort: reason => failure(reason),
  setStatus: message => { if (!started && !loadingFailed && message) status(message); },
  monitorRunDependencies: remaining => {
    if (remaining) $('loading').hidden = false;
  },
  onRuntimeInitialized: async () => {
    try {
      Module.FS.mkdirTree('/saves');
      Module.FS.mount(Module.FS.filesystems.IDBFS, {}, '/saves'); mounted = true;
      await sync(true);
      ready = true;
      $('start').disabled = false; $('start').hidden = false; $('export').disabled=false; $('restore').disabled=false;
      $('loading').hidden = true; status('Sẵn sàng. Bấm Bắt đầu chơi.');
    } catch (error) {
      // A denied IndexedDB must not overwrite an existing save with an empty filesystem.
      failure('Không mở được bộ nhớ lưu game. Hãy cho phép dữ liệu trang web rồi tải lại. ' + error);
    }
  }
};
$('start').onclick = () => {
  if (!ready || started) return;
  started = true; $('restore').disabled=true; $('start').disabled = true; $('start').hidden = true; $('keyboard').disabled = false;
  status('Đang khởi tạo game…'); canvas.focus();
  try { Module.callMain([]); }
  catch (error) { if (error !== 'unwind') { failure(error); return; } }
  Module._pvz_web_resume_audio();
  
  gameTimer = setInterval(() => {
    const state = Module._pvz_web_ready();
    if (state === -2) { clearInterval(gameTimer); failure('Không khởi tạo được đồ họa WebGL. Hãy bật tăng tốc đồ họa của trình duyệt hoặc thử Chrome/Edge.'); }
    else if (state < 0) { clearInterval(gameTimer); failure('Không tải được tài nguyên game. Hãy tải lại trang.'); }
    else if (state === 1) { clearInterval(gameTimer); status('Game đã sẵn sàng.'); }
  }, 500);
};

setInterval(() => { if (started) save(false).catch(log); }, 20000);
setInterval(() => { if (started && Module._pvz_web_text_active) $('keyboard').disabled = !Module._pvz_web_text_active(); }, 250);
document.addEventListener('visibilitychange', () => { if (document.hidden && started) save(false).catch(log); });
window.addEventListener('pagehide', () => { if (started) save(false).catch(log); });
document.addEventListener('pointerdown', () => { if (started) Module._pvz_web_resume_audio(); }, {passive:true});
$('fullscreen').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await $('stage').requestFullscreen(); canvas.focus(); }
  catch (error) { status('Trình duyệt chưa hỗ trợ toàn màn hình: ' + error, true); }
};
const keyboardInput = $('pvz-soft-keyboard');
$('keyboard').onpointerdown = event => event.preventDefault();
$('keyboard').onclick = () => {
  if (document.activeElement === keyboardInput) { keyboardInput.blur(); canvas.focus(); }
  else if (started) Module._pvz_web_keyboard();
};
for (const type of ['keydown','keyup','keypress']) keyboardInput.addEventListener(type, event => {
  // Native mobile input supplies text via input/composition events, not SDL key events.
  event.stopPropagation();
  if (type === 'keydown' && !event.isComposing && ['Enter','Escape'].includes(event.key)) {
    event.preventDefault(); Module._pvz_web_text_key(event.key === 'Enter' ? 13 : 27); keyboardInput.blur(); canvas.focus();
  }
});
function updateNativeText(event) {
  if (event.isComposing) return;
  Module.ccall('pvz_web_set_text', null, ['string','number','number'], [keyboardInput.value, keyboardInput.selectionStart, keyboardInput.selectionEnd]);
}
keyboardInput.addEventListener('input', updateNativeText);
keyboardInput.addEventListener('compositionend', updateNativeText);
canvas.addEventListener('contextmenu', event => event.preventDefault());
let lastTouchClick = {time:0,x:0,y:0,right:false,count:0};
function touchMouse(type, touch, right = false) {
  if (!started || !Module._pvz_web_pointer) return;
  const rect=canvas.getBoundingClientRect();
  const x=Math.round((touch.clientX-rect.left)*canvas.width/rect.width);
  const y=Math.round((touch.clientY-rect.top)*canvas.height/rect.height);
  let count=1;
  if(type==='mousedown') {
    const now=performance.now();
    count=lastTouchClick.right===right && now-lastTouchClick.time<500 && Math.hypot(x-lastTouchClick.x,y-lastTouchClick.y)<25 && lastTouchClick.count===1?2:1;
    lastTouchClick={time:now,x,y,right,count};
  }
  Module._pvz_web_pointer(type==='mousemove'?0:type==='mousedown'?1:2,x,y,right?1:0,count);
}
let holdTimer, touchOrigin, touchPressed = false, touchHeld = false, scrollTouch = false, scrollY = 0, scrollRemainder = 0;
canvas.addEventListener('touchstart', event => {
  event.preventDefault(); event.stopImmediatePropagation();
  if(event.touches.length>=2){
    clearTimeout(holdTimer);
    if(touchPressed)touchMouse('mouseup',touchOrigin);
    touchPressed=false;touchHeld=true;scrollTouch=true;activeTouch=null;
    scrollY=(event.touches[0].clientY+event.touches[1].clientY)/2;scrollRemainder=0;
    return;
  }
  if (scrollTouch || activeTouch!==null || !event.changedTouches.length) return;
  const touch=event.changedTouches[0]; activeTouch=touch.identifier;
  touchOrigin={clientX:touch.clientX,clientY:touch.clientY}; touchPressed=false; touchHeld=false;
  touchMouse('mousemove',touch); canvas.focus();
  // Hold for right-click without adding another control over the game.
  holdTimer=setTimeout(()=>{touchHeld=true;touchMouse('mousedown',touchOrigin,true);touchMouse('mouseup',touchOrigin,true);},350);
}, {capture:true,passive:false});
for (const type of ['touchmove','touchend','touchcancel']) canvas.addEventListener(type, event => {
  event.preventDefault(); event.stopImmediatePropagation();
  if(scrollTouch){
    if(type==='touchmove' && event.touches.length>=2){
      const x=(event.touches[0].clientX+event.touches[1].clientX)/2;
      const y=(event.touches[0].clientY+event.touches[1].clientY)/2;
      scrollRemainder+=y-scrollY;scrollY=y;
      const steps=Math.trunc(scrollRemainder/24);
      if(steps && started){const r=canvas.getBoundingClientRect();Module._pvz_web_wheel(Math.round((x-r.left)*canvas.width/r.width),Math.round((y-r.top)*canvas.height/r.height),steps);scrollRemainder-=steps*24;}
    }
    if(event.touches.length===0 || type==='touchcancel'){scrollTouch=false;activeTouch=null;}
    return;
  }
  for (const touch of event.changedTouches) if (touch.identifier===activeTouch) {
    if (type==='touchmove') {
      if (!touchHeld && !touchPressed && Math.hypot(touch.clientX-touchOrigin.clientX,touch.clientY-touchOrigin.clientY)>10) {
        clearTimeout(holdTimer); touchPressed=true; touchMouse('mousedown',touchOrigin);
      }
      if(touchPressed)touchMouse('mousemove',touch);
    } else {
      clearTimeout(holdTimer);
      if(!touchHeld && type==='touchend' && !touchPressed)touchMouse('mousedown',touch);
      if(touchPressed || (!touchHeld && type==='touchend'))touchMouse('mouseup',touch);
      activeTouch=null;
    }
  }
}, {capture:true,passive:false});
function filesBelow(path) {
  let files=[];
  for(const name of Module.FS.readdir(path)) {
    if(name==='.' || name==='..' || name==='cached')continue;
    const full=path+'/'+name;
    if(Module.FS.isDir(Module.FS.stat(full).mode))files.push(...filesBelow(full)); else files.push(full);
  }
  return files;
}
async function exportSave() {
  try {
    if(started)await save(false);
    const files=filesBelow('/saves').map(path => {
      const bytes=Module.FS.readFile(path); let binary='';
      for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
      return {path:path.slice('/saves/'.length),data:btoa(binary)};
    });
    const url=URL.createObjectURL(new Blob([JSON.stringify({format:'pvz-tft-web-save',version:1,files})],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='pvz-tft-save.json';link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Đã tải bản sao lưu tiến trình.');
  } catch(error) { notice('Không tạo được bản sao lưu: '+error); }
};
async function importSave(file) {
  if (!file || started) return;
  $('start').disabled = true; $('restore').disabled=true;
  try {
    if(file.size>16*1024*1024)throw new Error('Bản sao lưu vượt quá 16 MB.');
    const archive=JSON.parse(await file.text());
    if(archive.format!=='pvz-tft-web-save' || archive.version!==1 || !Array.isArray(archive.files))throw new Error('Sai định dạng bản sao lưu.');
    let total=0; const seen=new Set();
    const files=archive.files.map(entry => {
      if(typeof entry.path!=='string' || entry.path.includes('\\') || entry.path.split('/').some(x=>!x || x==='.' || x==='..') || seen.has(entry.path))throw new Error('Đường dẫn không hợp lệ.');
      seen.add(entry.path);const binary=atob(entry.data);total+=binary.length;
      if(total>12*1024*1024)throw new Error('Dữ liệu lưu quá lớn.');
      return {path:'/saves/'+entry.path,data:Uint8Array.from(binary,c=>c.charCodeAt(0))};
    });
    const previous=filesBelow('/saves').map(path=>({path,data:Module.FS.readFile(path)}));
    const writeAll=entries=>{
      for(const path of filesBelow('/saves'))Module.FS.unlink(path);
      for(const entry of entries){Module.FS.mkdirTree(entry.path.slice(0,entry.path.lastIndexOf('/')));Module.FS.writeFile(entry.path,entry.data);}
    };
    try { writeAll(files); await sync(); }
    catch(error) {writeAll(previous);await sync().catch(log);throw error;}
    status('Đã khôi phục tiến trình. Bấm Bắt đầu chơi.'); notice('Đã nhập save. Bấm nút chơi để tiếp tục.');
  } catch(error) { status('Không khôi phục được: '+error,true); notice('Không nhập được save: '+error); }
  finally { $('start').disabled=!ready; $('restore').disabled=!ready; }
};
$('export').onclick=()=>exportSave();
$('restore').onclick=()=>$('import').click();
$('import').onchange=async event=>{const file=event.target.files[0];if(file)await importSave(file);event.target.value='';};
</script>

</body>
</html>
